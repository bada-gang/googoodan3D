<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>모델 미리보기</title>
    <style>
      html, body { margin: 0; height: 100%; background: #e8f6fb; font-family: sans-serif; }
      #info { position: fixed; left: 12px; top: 12px; padding: 8px 12px; background: #fff6e2;
              border: 3px solid #4a3a2f; border-radius: 12px; font-size: 14px; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="info">불러오는 중…</div>
    <script type="module">
      // 개발용: 생성한 GLB 를 게임과 같은 조명으로 본다. ?src=/preview/xxx.glb
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
      import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
      import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
      import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js';

      // ?src=a.glb,b.glb 처럼 여러 개를 주면 나란히 놓는다 (원본과 경량화 비교 등)
      const params = new URLSearchParams(location.search);
      const sources = (params.get('src') ?? '/preview/test_apple.glb').split(',');
      // 다른 페이지에 끼워 넣을 때는 정보 상자를 숨긴다 (?info=0)
      if (params.get('info') === '0') document.getElementById('info').style.display = 'none';
      // ?spin=0 이면 돌리지 않는다 (모델이 어느 쪽을 보는지 확인할 때. 카메라는 +z 쪽)
      const spinSpeed = params.get('spin') === '0' ? 0 : 0.008;
      // ?yaw=1.57 처럼 처음 돌려 둘 각도 (옆모습 확인용, 라디안)
      const yaw = Number(params.get('yaw') ?? 0);
      // ?real=1 이면 크기를 맞추지 않고 실제 크기(m)로 나란히 놓는다 (가구끼리 크기 비교, 납작한 카펫 확인)
      const real = params.get('real') === '1';
      const spacing = real ? 2.6 : 1.3;
      // ?weights=1 이면 뼈대 부위마다 색을 칠한다 (자동 뼈대 확인). ?walk=1 이면 팔다리를 흔든다
      const showWeights = params.get('weights') === '1';
      const walk = params.get('walk') === '1';
      const BONE_COLORS = [[0.85, 0.85, 0.85], [0.2, 0.5, 1], [0.1, 0.8, 0.9], [1, 0.3, 0.3], [1, 0.75, 0.1]];
      const rigs = [];
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#e8f6fb');
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.add(new THREE.HemisphereLight('#bfe6f5', '#8bbd58', 0.6));
      const sun = new THREE.DirectionalLight('#ffffff', 1.8);
      sun.position.set(-3, 5, 3);
      sun.castShadow = true;
      scene.add(sun);

      const ground = new THREE.Mesh(new THREE.CircleGeometry(3, 48), new THREE.ShadowMaterial({ opacity: 0.18 }));
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
      camera.position.set(0, real ? 2.2 : 0.9, real ? 2 + 1.6 * sources.length : 1.9 + 0.9 * sources.length);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0.5, 0);

      const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
      const turntables = [];
      const lines = [];
      window.__modelStats = [];
      sources.forEach((src, index) => {
        loader.load(src, (gltf) => {
          const model = gltf.scene;
          model.traverse((o) => {
            if (!o.isSkinnedMesh) return;
            const bones = Object.fromEntries(o.skeleton.bones.map((b) => [b.name, b]));
            rigs.push(bones);
            if (!showWeights) return;
            const index = o.geometry.attributes.skinIndex;
            const weight = o.geometry.attributes.skinWeight;
            const colors = new Float32Array(index.count * 3);
            for (let i = 0; i < index.count; i++) {
              const main = weight.getX(i) >= weight.getY(i) ? index.getX(i) : index.getY(i);
              colors.set(BONE_COLORS[main] ?? [0, 0, 0], i * 3);
            }
            o.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            o.material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 });
          });
          // 높이 1 로 맞추고 바닥에 세운다
          const box = new THREE.Box3().setFromObject(model);
          if (!real) model.scale.setScalar(1 / box.getSize(new THREE.Vector3()).y);
          box.setFromObject(model);
          model.position.sub(new THREE.Vector3((box.min.x + box.max.x) / 2, box.min.y, (box.min.z + box.max.z) / 2));
          let triangles = 0;
          const textures = new Set();
          model.traverse((o) => {
            if (!o.isMesh) return;
            o.castShadow = true;
            triangles += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
            for (const key of ['map', 'normalMap', 'roughnessMap', 'metalnessMap']) {
              const t = o.material[key];
              if (t?.image) textures.add(`${key} ${t.image.width}×${t.image.height}`);
            }
          });
          // 나란히 놓고 각자 제자리에서 돈다
          const turntable = new THREE.Group();
          turntable.position.x = (index - (sources.length - 1) / 2) * spacing;
          turntable.rotation.y = yaw;
          turntable.add(model);
          scene.add(turntable);
          turntables.push(turntable);
          lines[index] = `${src}\n  삼각형 ${Math.round(triangles).toLocaleString()}개 · ${[...textures].join(', ')}`;
          document.getElementById('info').textContent = lines.filter(Boolean).join('\n');
          window.__modelStats[index] = { src, triangles, textures: [...textures] };
        });
      });

      renderer.setAnimationLoop(() => {
        for (const t of turntables) t.rotation.y += spinSpeed;
        if (walk) {
          const phase = performance.now() / 1000 * 7;
          const swing = Math.sin(phase);
          const forwardL = -Math.cos(phase);
          for (const bones of rigs) {
            // 게임(Player.tsx)과 같게: 앞으로 내딛는 쪽을 크게
            if (bones.leg_L) bones.leg_L.rotation.x = swing > 0 ? swing * 0.45 : swing * 0.9;
            if (bones.leg_R) bones.leg_R.rotation.x = swing > 0 ? -swing * 0.9 : -swing * 0.45;
            if (bones.shin_L) bones.shin_L.rotation.x = Math.max(0, forwardL) * 0.95;
            if (bones.shin_R) bones.shin_R.rotation.x = Math.max(0, -forwardL) * 0.95;
            if (bones.arm_L) bones.arm_L.rotation.x = -swing * 0.6;
            if (bones.arm_R) bones.arm_R.rotation.x = swing * 0.6;
          }
        }
        controls.update();
        renderer.render(scene, camera);
      });
      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    </script>
  </body>
</html>
